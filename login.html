<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.25);
            --glow: rgba(37, 99, 235, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated matrix-effect */
        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .matrix-column {
            position: absolute;
            top: -100%;
            width: 2px;
            background: linear-gradient(
                180deg,
                transparent,
                rgba(37, 99, 235, 0.8),
                rgba(37, 99, 235, 0.4),
                transparent
            );
            animation: matrixFall linear infinite;
        }

        @keyframes matrixFall {
            0% { 
                transform: translateY(-100vh);
                opacity: 0;
            }
            10% { 
                opacity: 1;
            }
            90% { 
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Geometric-shapes*/
        .geometric-shape {
            position: absolute;
            opacity: 0.1;
            animation: geometricFloat 12s ease-in-out infinite;
        }

        .shape-1 {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, var(--primary-color), transparent);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            top: 20%;
            left: 15%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--warning-color), transparent);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            top: 70%;
            right: 20%;
            animation-delay: -4s;
        }

        .shape-3 {
            width: 50px;
            height: 50px;
            background: linear-gradient(225deg, var(--success-color), transparent);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            bottom: 30%;
            left: 70%;
            animation-delay: -2s;
        }

        .shape-4 {
            width: 70px;
            height: 70px;
            background: linear-gradient(315deg, var(--primary-color), transparent);
            border-radius: 50%;
            top: 40%;
            right: 10%;
            animation-delay: -6s;
        }

        .shape-5 {
            width: 90px;
            height: 90px;
            background: linear-gradient(45deg, var(--warning-color), transparent);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            top: 10%;
            right: 40%;
            animation-delay: -3s;
        }

        @keyframes geometricFloat {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            25% { 
                transform: translateY(-30px) rotate(90deg) scale(1.1);
            }
            50% { 
                transform: translateY(-60px) rotate(180deg) scale(0.9);
            }
            75% { 
                transform: translateY(-30px) rotate(270deg) scale(1.1);
            }
        }

        /* Pulsing dots network */
        .dot-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .network-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 3s ease-in-out infinite;
        }

        .network-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0.2;
            animation: lineGlow 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.3;
            }
            50% { 
                transform: scale(1.5);
                opacity: 0.8;
            }
        }

        @keyframes lineGlow {
            0%, 100% { 
                opacity: 0.1;
            }
            50% { 
                opacity: 0.4;
            }
        }

        /* Main-container */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 0;
            width: 100%;
            max-width: 480px;
            box-shadow: 
                0 25px 50px var(--shadow),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 35px 80px var(--shadow),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* Header */
        .header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(245, 158, 11, 0.05));
        }

        .logo {
            width: 48px;
            height: 48px;
            background: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.3);
        }

        .logo i {
            color: white;
            font-size: 20px;
        }

        .welcome-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Tab-system */
        .tab-container {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            margin: 0 32px;
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 32px;
            margin-top: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
        }

        .tab:hover:not(.active) {
            background: var(--surface-hover);
            color: var(--text-secondary);
        }

        /* Form-container */
        .form-container {
            padding: 0 32px 32px;
        }

        .form {
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input-groups */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 16px;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .input-group input:focus + .input-icon {
            color: var(--primary-color);
        }

        .input-group label {
            position: absolute;
            top: 16px;
            left: 48px;
            color: var(--text-muted);
            font-size: 16px;
            transition: all 0.3s ease;
            pointer-events: none;
            background: transparent;
        }

        .input-group input:focus + .input-icon + label,
        .input-group input:not(:placeholder-shown) + .input-icon + label {
            top: -8px;
            left: 16px;
            font-size: 12px;
            color: var(--primary-color);
            background: var(--surface);
            padding: 0 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Password-visibility*/
        .password-toggle {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        /* Buttons*/
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Loading-state */
        .btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Links & text */
        .forgot-password {
            text-align: right;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .switch-form {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .switch-form p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .switch-form button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .switch-form button:hover {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-hover);
        }

        /* Validation-messages */
        .validation-message {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            display: none;
        }

        .validation-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .validation-message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Responsive-design */
        @media (max-width: 520px) {
            .container {
                margin: 20px;
                max-width: none;
            }
            
            .header, .form-container, .tab-container {
                padding-left: 24px;
                padding-right: 24px;
            }
            
            .welcome-text {
                font-size: 24px;
            }
        }

        /* Accessibility-improvements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus-indicators */
        .tab:focus,
        .btn:focus,
        input:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <!-- Background-elements -->
    <div class="matrix-rain" id="matrixRain"></div>
    <div class="dot-network" id="dotNetwork"></div>
    
    <!-- Geometric-shapes -->
    <div class="geometric-shape shape-1"></div>
    <div class="geometric-shape shape-2"></div>
    <div class="geometric-shape shape-3"></div>
    <div class="geometric-shape shape-4"></div>
    <div class="geometric-shape shape-5"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1 class="welcome-text">Welcome Back</h1>
            <p class="subtitle">Please sign in to your account</p>
        </div>

        <!-- Tab-Navigation -->
        <div class="tab-container">
            <div class="tab active" data-tab="login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </div>
            <div class="tab" data-tab="signup">
                <i class="fas fa-user-plus"></i> Sign Up
            </div>
        </div>

        <div class="form-container">
            <!-- Login-Form -->
            <div class="form active" id="loginForm">
                <form id="loginFormElement">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder=" " required>
                            <label for="loginEmail">Email Address</label>
                        </div>
                        <div class="validation-message" id="loginEmailError"></div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder=" " required>
                            <label for="loginPassword">Password</label>
                            <i class="password-toggle fas fa-eye" data-target="loginPassword"></i>
                        </div>
                        <div class="validation-message" id="loginPasswordError"></div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Sign In</span>
                    </button>
                </form>

                <div class="switch-form">
                    <p>Don't have an account?</p>
                    <button type="button" data-switch="signup">Create Account</button>
                </div>
            </div>

            <!-- Signup-Form -->
            <div class="form" id="signupForm">
                <form id="signupFormElement">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-user"></i>
                            <input type="text" id="signupName" placeholder=" " required>
                            <label for="signupName">Full Name</label>
                        </div>
                        <div class="validation-message" id="signupNameError"></div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-envelope"></i>
                            <input type="email" id="signupEmail" placeholder=" " required>
                            <label for="signupEmail">Email Address</label>
                        </div>
                        <div class="validation-message" id="signupEmailError"></div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-lock"></i>
                            <input type="password" id="signupPassword" placeholder=" " required>
                            <label for="signupPassword">Password</label>
                            <i class="password-toggle fas fa-eye" data-target="signupPassword"></i>
                        </div>
                        <div class="validation-message" id="signupPasswordError"></div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="input-icon fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder=" " required>
                            <label for="confirmPassword">Confirm Password</label>
                            <i class="password-toggle fas fa-eye" data-target="confirmPassword"></i>
                        </div>
                        <div class="validation-message" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Create Account</span>
                    </button>
                </form>

                <div class="switch-form">
                    <p>Already have an account?</p>
                    <button type="button" data-switch="login">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.form');
        const switchButtons = document.querySelectorAll('[data-switch]');

        function switchTab(targetTab) {
            // Update tabs
            tabs.forEach(tab => tab.classList.remove('active'));
            document.querySelector(`[data-tab="${targetTab}"]`).classList.add('active');

            // Update forms
            forms.forEach(form => form.classList.remove('active'));
            document.getElementById(`${targetTab}Form`).classList.add('active');

            // Update header text
            const headerText = document.querySelector('.welcome-text');
            const subtitle = document.querySelector('.subtitle');
            
            if (targetTab === 'login') {
                headerText.textContent = 'Welcome Back';
                subtitle.textContent = 'Please sign in to your account';
            } else {
                headerText.textContent = 'Create Account';
                subtitle.textContent = 'Join us and get started today';
            }
        }

        // Tab click handlers
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.tab);
            });
        });

        // Switch form button 
        switchButtons.forEach(button => {
            button.addEventListener('click', () => {
                switchTab(button.dataset.switch);
            });
        });

        // Password visibility toggle
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const targetInput = document.getElementById(this.dataset.target);
                const isPassword = targetInput.type === 'password';
                
                targetInput.type = isPassword ? 'text' : 'password';
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        });

        // Form-validation
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePassword(password) {
            return password.length >= 8;
        }

        function showValidationMessage(inputId, message, type = 'error') {
            const messageElement = document.getElementById(inputId + 'Error');
            messageElement.textContent = message;
            messageElement.className = `validation-message ${type}`;
            messageElement.style.display = 'block';
        }

        function hideValidationMessage(inputId) {
            const messageElement = document.getElementById(inputId + 'Error');
            messageElement.style.display = 'none';
        }

        // Real-time validation
        document.getElementById('loginEmail').addEventListener('blur', function() {
            if (!this.value.trim()) {
                showValidationMessage('loginEmail', 'Email address is required');
            } else if (!validateEmail(this.value)) {
                showValidationMessage('loginEmail', 'Please enter a valid email address');
            } else {
                hideValidationMessage('loginEmail');
            }
        });

        document.getElementById('loginPassword').addEventListener('blur', function() {
            if (!this.value.trim()) {
                showValidationMessage('loginPassword', 'Password is required');
            } else {
                hideValidationMessage('loginPassword');
            }
        });

        document.getElementById('signupName').addEventListener('blur', function() {
            if (!this.value.trim()) {
                showValidationMessage('signupName', 'Full name is required');
            } else if (this.value.trim().length < 2) {
                showValidationMessage('signupName', 'Name must be at least 2 characters long');
            } else {
                hideValidationMessage('signupName');
            }
        });

        document.getElementById('signupEmail').addEventListener('blur', function() {
            if (!this.value.trim()) {
                showValidationMessage('signupEmail', 'Email address is required');
            } else if (!validateEmail(this.value)) {
                showValidationMessage('signupEmail', 'Please enter a valid email address');
            } else {
                hideValidationMessage('signupEmail');
            }
        });

        document.getElementById('signupPassword').addEventListener('blur', function() {
            if (!this.value.trim()) {
                showValidationMessage('signupPassword', 'Password is required');
            } else if (!validatePassword(this.value)) {
                showValidationMessage('signupPassword', 'Password must be at least 8 characters long');
            } else {
                hideValidationMessage('signupPassword');
            }
        });

        document.getElementById('confirmPassword').addEventListener('blur', function() {
            const password = document.getElementById('signupPassword').value;
            if (!this.value.trim()) {
                showValidationMessage('confirmPassword', 'Please confirm your password');
            } else if (this.value !== password) {
                showValidationMessage('confirmPassword', 'Passwords do not match');
            } else {
                hideValidationMessage('confirmPassword');
            }
        });

        // Form submission-validation
        function validateForm(form) {
            let isValid = true;
            const formData = new FormData(form);
            
            if (form.id === 'loginFormElement') {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                
                if (!email) {
                    showValidationMessage('loginEmail', 'Email address is required');
                    isValid = false;
                } else if (!validateEmail(email)) {
                    showValidationMessage('loginEmail', 'Please enter a valid email address');
                    isValid = false;
                } else {
                    hideValidationMessage('loginEmail');
                }
                
                if (!password) {
                    showValidationMessage('loginPassword', 'Password is required');
                    isValid = false;
                } else {
                    hideValidationMessage('loginPassword');
                }
            } else if (form.id === 'signupFormElement') {
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();
                
                if (!name) {
                    showValidationMessage('signupName', 'Full name is required');
                    isValid = false;
                } else if (name.length < 2) {
                    showValidationMessage('signupName', 'Name must be at least 2 characters long');
                    isValid = false;
                } else {
                    hideValidationMessage('signupName');
                }
                
                if (!email) {
                    showValidationMessage('signupEmail', 'Email address is required');
                    isValid = false;
                } else if (!validateEmail(email)) {
                    showValidationMessage('signupEmail', 'Please enter a valid email address');
                    isValid = false;
                } else {
                    hideValidationMessage('signupEmail');
                }
                
                if (!password) {
                    showValidationMessage('signupPassword', 'Password is required');
                    isValid = false;
                } else if (!validatePassword(password)) {
                    showValidationMessage('signupPassword', 'Password must be at least 8 characters long');
                    isValid = false;
                } else {
                    hideValidationMessage('signupPassword');
                }
                
                if (!confirmPassword) {
                    showValidationMessage('confirmPassword', 'Please confirm your password');
                    isValid = false;
                } else if (confirmPassword !== password) {
                    showValidationMessage('confirmPassword', 'Passwords do not match');
                    isValid = false;
                } else {
                    hideValidationMessage('confirmPassword');
                }
            }
            
            return isValid;
        }

        function handleFormSubmission(form, buttonText) {
            if (!validateForm(form)) {
                return;
            }
            
            const button = form.querySelector('.btn');
            const buttonTextElement = button.querySelector('.btn-text');
            
            button.classList.add('loading');
            buttonTextElement.textContent = 'Processing...';
            
            setTimeout(() => {
                button.classList.remove('loading');
                buttonTextElement.textContent = buttonText;
                
                //success message
                showValidationMessage(
                    form.id === 'loginFormElement' ? 'loginEmail' : 'signupEmail',
                    'Success! Redirecting...',
                    'success'
                );
                
                setTimeout(() => {
                    form.reset();
                    document.querySelectorAll('.validation-message').forEach(msg => {
                        msg.style.display = 'none';
                    });
                }, 2000);
            }, 2000);
        }

        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            handleFormSubmission(this, 'Sign In');
        });

        document.getElementById('signupFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            handleFormSubmission(this, 'Create Account');
        });

        // Forgot password 
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Password reset functionality would be implemented here.');
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                document.body.classList.add('keyboard-navigation');
            }
        });

        document.addEventListener('mousedown', function() {
            document.body.classList.remove('keyboard-navigation');
        });
    </script>
</body>
</html>
