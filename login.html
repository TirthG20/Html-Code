<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Login Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /*background-particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.3);
        }

        /* Toggle-switch */
        #check {
            display: none;
        }

        .toggle-container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 5px;
            margin-bottom: 30px;
            display: flex;
            backdrop-filter: blur(10px);
        }

        .toggle-option {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 14px;
        }

        .toggle-option.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(20px);
        }

        /* Form-styles */
        .form {
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form header {
            font-size: 2.2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -10px;
            left: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(103, 126, 234, 0.8);
            padding: 2px 8px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: white;
            text-decoration: underline;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .signup-link span {
            color: white;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .signup-link span:hover {
            color: #ff6b6b;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 25px;
            }
            
            .form header {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!--particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Toggle-switch -->
        <div class="toggle-container">
            <div class="toggle-option active" id="loginToggle">Login</div>
            <div class="toggle-option" id="signupToggle">Sign Up</div>
        </div>

        <!-- Login-Form -->
        <div class="form active" id="loginForm">
            <header>Welcome Back</header>
            <form>
                <div class="input-group">
                    <input type="email" placeholder=" " required>
                    <label>Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" placeholder=" " required>
                    <label>Password</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot your password?</a>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <div class="signup-link">
                Don't have an account? <span id="switchToSignup">Create one</span>
            </div>
        </div>

        <!-- Signup-Form -->
        <div class="form" id="signupForm">
            <header>Create Account</header>
            <form>
                <div class="input-group">
                    <input type="email" placeholder=" " required>
                    <label>Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" placeholder=" " required>
                    <label>Create Password</label>
                </div>
                <div class="input-group">
                    <input type="password" placeholder=" " required>
                    <label>Confirm Password</label>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
            <div class="signup-link">
                Already have an account? <span id="switchToLogin">Sign in</span>
            </div>
        </div>
    </div>

    <script>
        //animated-particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Toggle between login & signup
        const loginToggle = document.getElementById('loginToggle');
        const signupToggle = document.getElementById('signupToggle');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const switchToSignup = document.getElementById('switchToSignup');
        const switchToLogin = document.getElementById('switchToLogin');

        function showLogin() {
            loginToggle.classList.add('active');
            signupToggle.classList.remove('active');
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
        }

        function showSignup() {
            signupToggle.classList.add('active');
            loginToggle.classList.remove('active');
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
        }

        loginToggle.addEventListener('click', showLogin);
        signupToggle.addEventListener('click', showSignup);
        switchToSignup.addEventListener('click', showSignup);
        switchToLogin.addEventListener('click', showLogin);

        // Initialize-particles
        createParticles();

        // Add form submission handling
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = this.querySelector('.btn');
                const originalText = btn.textContent;
                
                btn.textContent = 'Loading...';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                    alert('Form submitted successfully!');
                }, 2000);
            });
        });
    </script>
</body>
</html>
